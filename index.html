<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 2</title>

</head>
<body>

    <h3>Formulário</h3>
    <hr>
    <form action="">
        <legend>Dados Pessoais</legend>
        <br><br>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" required placeholder="Digite seu nome...">
    </form>
    <br>
    <form action="">
        <label for="sobrenome">Sobrenome</label>
        <input type="text" id="sobrenome" required placeholder="Digite seu sobrenome...">
    </form>
    <br>
    <form action="">
        <label for="idade">Idade:</label>
        <input type="number" id="idade" required placeholder="Digite sua idade...">
    </form>

</body>
</html>
