<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Store - Cadastro</title>

</head>

<link rel="stylesheet" href="script.js">
<link rel="stylesheet" href="style.css">

<body>
    
    <header class="topo">
        <h1>🎮 Game Store</h1>
        <nav>
            <a href="index.html">Início</a>
            <a href="index.html#jogos">Jogos</a>
            <a href="cadastro.html">Cadastro</a>
        </nav>
    </header>
    <main class="area-cadastro">
        <form id="formCadastro">
            <h2>Crie sua conta</h2>
            <p>Faça parte da comunidade Game Store!</p>
            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" placeholder="Digite seu nome.." required>
            <br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="seu@email.com" required>
            <br><br>
            <label for="senha">Senha:</label>
            <input type="password" id="senha" placeholder="Crie uma senha" minlength="6">
            <br><br>
            <label for="plataforma">Sua plataforma favorita:</label>
            <select id="plataforma" required>
                <option value="">Selecione:</option>
                <option value="PC">PC</option>
                <option value="PlayStation">PlayStation</option>
                <option value="Xbox">Xbox</option>
                <option value="Nintendo">Nintendo</option>
            </select>
            <br><br>
            <button type="submit" class="botao">Cadastrar</button>
            <p id="mensagem" aria-live="polite"></p>
            <a href="index.html" class="voltar">Voltar para página inicial</a>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Game Store - Todos os direitos reservados.</p>
    </footer>

</body>
</html>
