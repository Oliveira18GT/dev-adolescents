<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 4</title>

</head>
<body>
    <div class="Título">
        <h1>Formulário dos lindos</h1>
    </div>
    <style>
        .Título {color: rgb(190, 21, 21);}
    </style>
    <hr>
<form action="#" method="post">

    <label for="nome"><h2>Nome:</h2></label>
    <input type="text" id="nome" placeholder="Seu nome completo" required>
    <br><br>
    <label for="email"><h2>E-mail:</h2></label>
    <input type="email" id="email" placeholder="seuemail@email.com" required>
    <br><br>
    <label for="senha"><h2>Senha:</h2>(min 6, só letras e números):</label>
    <input type="password" id="senha" pattern="[a-zA-Z0-9]{6,}" placeholder="Mínimo 6 caracteres.." required>
    <br><br>
    <label for="idade"><h2>Idade (13 a 99 anos)</h2></label>
    <input type="number" id="idade" min="13" max="99" required>
    <br><br>
    <label for="data"><h2>Data (Só em 2026)</h2></label>
    <input type="date" id="data" min="2026-01-01" max="2026-12-31" required>
    <br><br>
    <label for="telefone"><h2>Telefone:</h2></label>
    <input type="tel" id="telefone" pattern="\([0-9]){2}\) [0-9]{5}-[0-9]{4}" placeholder="(51) 99999 9999" required>
    <br><br>
    <label for="nota"><h2>Nota (0 a 10)</h2></label>
    <input type="range" id="nota" min="0" max="10" value="7">
    <br><br>
    <label for="cor"><h2>Cor favorita</h2></label>
    <input type="color" id="cor" value="f000000">
    <br><br>
    <label for="codigo"><h2>Código (gerado automaticamente):</h2></label>
    <input type="text" id="codigo" value="ALU-2026-001" disabled>
    <br><br>
    <fieldset>
        <label for="termos"><h4>Aceito os termos de uso</h4></label>
        <input type="checkbox" name="termos" required>
    </fieldset>
    <br> 
    <button type="submit"><strong>Enviar</strong></button>


</form>

</body>
</html>
