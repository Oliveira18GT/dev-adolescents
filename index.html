        </thead>

            <tr>
                <td><strong>Lucas</strong></td>

            </tr>
            <tr>

</div>
    <form action="#" method="post">

        <label for="nome"><h2>Nome:</h2></label>
        <input type="text" id="nome" placeholder="Seu nome completo" required>
        <br><br>
        <label for="email"><h2>E-mail:</h2></label>
        <input type="email" id="email" placeholder="seuemail@email.com" required>
        <br><br>
        <label for="senha"><h2>Senha:</h2>(min 6, só letras e números):</label>
        <br>
        <input type="password" id="senha" pattern="[a-zA-Z0-9]{6,}" placeholder="Mínimo 6 caracteres.." required>
        <br><br>
        <label for="cidade"><h2>Cidade:</h2></label>
    <select name="cidade" id="cidade" required>
        <option value="">Selecione..</option>
        <option value="sl">São Leopoldo</option>
        <option value="nh">Novo Hamburgo</option>
        <option value="cb">Campo Bom</option>
        <option value="mgo">Montenegro</option>
        <option value="pa">Porto Alegre</option>
        <option value="ev">Estância velha</option>
        <option value="cn">Canoas</option>
    </select>
        <br><br>
        <label for="telefone"><h2>Telefone:</h2></label>
        <input type="tel" id="telefone" pattern="\([0-9]){2}\) [0-9]{5}-[0-9]{4}" placeholder="(51) 99999 9999" required>
        <br><br>
        <label for="cor"><h2>Cor favorita</h2></label>
        <input type="color" id="cor" value="f000000">
        <br><br>
        <fieldset>
            <label for="termos"><h3>Aceito os termos de uso</h3></label>
            <input type="checkbox" name="termos" required>
        </fieldset>
        <br> 
        <button type="submit"><strong>Enviar</strong></button>

</form>
</body>
</html>
